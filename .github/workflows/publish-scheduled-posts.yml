name: Publish scheduled posts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  trigger-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Call SocialStudio cron publish endpoint
        run: |
          curl --fail --show-error --silent \
            -X GET "https://social-media-app-two-coral.vercel.app/api/cron/publish" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
